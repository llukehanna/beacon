name: Reseed

on:
  workflow_dispatch:
    inputs:
      target:
        description: Database to reseed
        type: choice
        required: true
        options:
          - production
          - presenter

permissions:
  contents: read

jobs:
  reseed:
    runs-on: ubuntu-latest
    steps:
      - name: Select the database URL for the chosen target
        env:
          TARGET: ${{ inputs.target }}
          DB_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
          DB_PRESENTER: ${{ secrets.DATABASE_URL_PRESENTER }}
        run: |
          case "$TARGET" in
            production) url="$DB_PRODUCTION"; secret=DATABASE_URL_PRODUCTION ;;
            presenter) url="$DB_PRESENTER"; secret=DATABASE_URL_PRESENTER ;;
            *) echo "::error::Unknown target '$TARGET'."; exit 1 ;;
          esac
          if [ -z "$url" ]; then
            echo "::error::The secret $secret for target '$TARGET' is empty or not set."
            exit 1
          fi
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run seed
